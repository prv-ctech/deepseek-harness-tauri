# Selkies runs as fixed UID/GID 1000:1000; PUID/PGID do not remap it.
services:
  desktop:
    image: ${IMAGE:-ghcr.io/prv-ctech/deepseek-harness-tauri:latest}
    build:
      context: .
    platform: linux/amd64
    restart: unless-stopped
    shm_size: 2gb
    depends_on:
      dind:
        condition: service_healthy
    group_add:
      - "100"
    environment:
      SELKIES_ENABLE_BASIC_AUTH: "false"
      SELKIES_ENABLE_HTTPS: "false"
      DOCKER_HOST: tcp://deepseek-harness-dind:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
      # Keep the upstream startup URL out of container logs.
      RUST_LOG: warn
    expose:
      - "8080"
    networks:
      - shared
    volumes:
      - home:/home/ubuntu
      - workspaces:/workspaces
      - docker-certs-client:/certs/client:ro

  dind:
    image: docker:29.8.0-dind
    platform: linux/amd64
    privileged: true
    restart: unless-stopped
    environment:
      DOCKER_TLS_CERTDIR: /certs
      DOCKER_TLS_SAN: DNS:deepseek-harness-dind
    expose:
      - "2376"
    volumes:
      - docker-data:/var/lib/docker
      - docker-certs-ca:/certs/ca
      - docker-certs-client:/certs/client
    networks:
      shared:
        aliases:
          - deepseek-harness-dind
    healthcheck:
      test: ["CMD", "docker", "--host=unix:///var/run/docker.sock", "info"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  shared:
    external: true
    name: ${DSH_NETWORK:?Set DSH_NETWORK to an existing user-defined Docker network}

volumes:
  home:
  workspaces:
  docker-data:
  docker-certs-ca:
  docker-certs-client:
